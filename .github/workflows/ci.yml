name: PR Checks

on:
  pull_request:
    branches: [master, develop]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Print head and base refs
        run: |
          echo "Head ref: ${{ github.head_ref }}"
          echo "Base ref: ${{ github.base_ref }}"

      - name: Setup pnpm, Node.js, and dependencies
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node
          node-version-file: .nvmrc
          cache: true
          require-lockfile: true

      - name: Run tests
        run: pnpm run test

      - name: Type check
        run: pnpm run typecheck

      - name: Check code quality
        run: |
          pnpm run lint
          pnpm run format:check
          pnpm run --if-present generate

      - name: Security audit
        run: pnpm audit

      - name: Archive production artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-artifacts
          path: ./dist/

      - name: Error handling
        if: failure()
        run: echo "CI failed. Please check the logs."
